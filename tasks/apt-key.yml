---
# Verifies and installs the InfluxData apt key at _telegraf_apt_key_dest. The
# key is fetched into a private temporary directory first and only installed
# when it holds exactly one key and the fingerprint of that key is
# telegraf_gpgkey_fingerprint. Installing to the same destination as before
# keeps earlier installs of this role updated in place.
- name: apt-key | Create temporary directory
  ansible.builtin.tempfile:
    state: directory
    prefix: apt-key-
  register: _telegraf_apt_key_dir
  changed_when: false

- name: apt-key | Verify and install key
  block:
    - name: apt-key | Download key
      ansible.builtin.get_url:
        url: "{{ telegraf_apt_gpgkey }}"
        dest: "{{ _telegraf_apt_key_dir.path }}/key"
        mode: "0600"
      changed_when: false
      register: _telegraf_apt_key_download
      until: _telegraf_apt_key_download is succeeded

    - name: apt-key | Read key fingerprints
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - --with-fingerprint
          - "{{ _telegraf_apt_key_dir.path }}/key"
      environment:
        GNUPGHOME: "{{ _telegraf_apt_key_dir.path }}"
      changed_when: false
      register: _telegraf_apt_key_info

    # In the colon listing the first fpr line is the fingerprint of the
    # primary key, the ones after it belong to subkeys.
    - name: apt-key | Verify key fingerprint
      ansible.builtin.assert:
        that:
          - _telegraf_apt_key_info.stdout_lines | select('match', '^(pub|sec):') | list | length == 1
          - (_telegraf_apt_key_info.stdout_lines | select('match', '^fpr:') | first).split(':')[9] | upper == telegraf_gpgkey_fingerprint | upper
        fail_msg: >-
          The key downloaded from {{ telegraf_apt_gpgkey }} is not a single
          key with fingerprint {{ telegraf_gpgkey_fingerprint }}, refusing to trust it.
        quiet: true

    - name: apt-key | Install key
      ansible.builtin.copy:
        src: "{{ _telegraf_apt_key_dir.path }}/key"
        dest: "{{ _telegraf_apt_key_dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      become: true
  always:
    - name: apt-key | Remove temporary directory
      ansible.builtin.file:
        path: "{{ _telegraf_apt_key_dir.path }}"
        state: absent
      changed_when: false
