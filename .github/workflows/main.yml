---
name: MasterRun
"on":
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**/CHANGELOG.md"
  workflow_dispatch:
jobs:
  runme:
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dj-wasabi-release repo
        uses: actions/checkout@v7
        with:
          repository: dj-wasabi/dj-wasabi-release
          path: dj-wasabi-release
      - name: Checkout current repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: current-repo
      - name: Generate changelog
        env:
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd current-repo
          ../dj-wasabi-release/release.sh -d
      - name: Open changelog update pull request
        uses: peter-evans/create-pull-request@v8.1.3
        with:
          path: current-repo
          add-paths: CHANGELOG.md
          branch: automation/changelog-draft
          commit-message: Update CHANGELOG.md
          title: Update CHANGELOG.md
          body: Generated release changelog update.
